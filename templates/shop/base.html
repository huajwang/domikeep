{% extends "base.html" %}
{% block header %}
  <header class="top shop-top">
    <div class="utility">
      <a href="{{ company_origin }}">Domikeep Technologies Inc.</a>
      {% if contact_phone %}<a href="tel:{{ contact_phone }}">{{ contact_phone }}</a>{% endif %}
      <a href="mailto:{{ contact_email }}">{{ contact_email }}</a>
    </div>
    <div class="bar">
      <a class="mark" href="{% url 'home' %}">Emall</a>
      <nav class="links" aria-label="Shop">
        {% for category in nav_categories %}
          <a href="{% url 'category' category.slug %}">{{ category.name }}</a>
        {% endfor %}
        <a href="{% url 'quote' %}">Quote</a>
      </nav>
      <a class="pill" href="{% url 'cart' %}">Cart ({{ cart_count }})</a>
    </div>
  </header>
{% endblock %}
