# Port 443 stays owned by nginx. A later Cloud Link relay is chosen by
# SNI for its own hostname and does not use these server names.
# After DNS points here, run:
#   certbot --nginx -d domikeep.com -d www.domikeep.com -d emall.domikeep.com

server {
    listen 80;
    server_name www.domikeep.com;
    return 301 https://domikeep.com$request_uri;
}

server {
    listen 80;
    server_name domikeep.com;
    client_max_body_size 8m;

    location /static/ {
        alias /opt/domikeep/staticfiles/;
    }

    location /media/ {
        alias /var/lib/domikeep/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name emall.domikeep.com;
    client_max_body_size 8m;

    location /static/ {
        alias /opt/domikeep/staticfiles/;
    }

    location /media/ {
        alias /var/lib/domikeep/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
